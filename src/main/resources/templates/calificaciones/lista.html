<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${titulo})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('calificaciones')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
                <h1 th:text="${titulo}">Calificaciones</h1>
                <p>Opiniones de los jugadores sobre las canchas.</p>
            </div>
            <div class="acciones"><a class="btn btn-primario" th:href="@{/calificaciones/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Nueva calificación</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="tarjeta">
            <div th:if="${#lists.isEmpty(calificaciones)}">
            <div class="vacio">
                <div class="icono-vacio"><th:block th:replace="~{fragmentos/iconos :: icono('estrella')}"></th:block></div>
                <strong>Todavía no hay calificaciones</strong>
                <p>Después de jugar, califica la cancha desde tu reserva.</p>
                <a class="btn btn-primario" th:href="@{/calificaciones/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Nueva calificación</a>
            </div>
            </div>
            <div class="tabla-envoltura" th:unless="${#lists.isEmpty(calificaciones)}">
                <table class="tabla">
                    <thead><tr><th>#</th><th>Jugador</th><th>Cancha</th><th>Puntuación</th><th>Comentario</th><th>Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${calificaciones}">
                        <td class="id" th:text="${c.id}">1</td>
                        <td>
                            <div class="celda-persona" th:if="${c.usuario != null}">
                                <span class="avatar" th:text="${#strings.substring(c.usuario.nombre, 0, 1)}">L</span>
                                <span class="principal" th:text="${c.usuario.nombre}">Laura</span>
                            </div>
                        </td>
                        <td><a th:if="${c.espacio != null}" th:href="@{/espacios/{id}(id=${c.espacio.id})}" th:text="${c.espacio.nombre}">Cancha</a></td>
                        <td><span th:replace="~{fragmentos/iconos :: estrellas(${c.puntuacion})}"></span></td>
                        <td><span class="texto-corto" style="display:block" th:text="${c.comentario}">Excelente</span></td>
                        <td>
                            <div class="acciones-fila">
                                <a class="btn btn-neutro btn-sm" th:href="@{/calificaciones/{id}(id=${c.id})}">Ver</a>
                                <a class="btn btn-neutro btn-sm" th:href="@{/calificaciones/update/{id}(id=${c.id})}" title="Editar"><th:block th:replace="~{fragmentos/iconos :: icono('editar')}"></th:block></a>
                                <a class="btn btn-peligro btn-sm" th:href="@{/calificaciones/delete/{id}(id=${c.id})}"
                                   onclick="return confirm('¿Eliminar esta calificación?')" title="Eliminar"><th:block th:replace="~{fragmentos/iconos :: icono('basura')}"></th:block></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
