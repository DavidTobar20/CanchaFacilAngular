<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${espacio.nombre})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('canchas')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/espacios}">Canchas</a><span>/</span><span th:text="${espacio.nombre}">Cancha</span></div>
                <h1 th:text="${espacio.nombre}">Cancha</h1>
                <p><span th:text="${espacio.negocio != null} ? ${espacio.negocio.nombre} : ''">Negocio</span></p>
            </div>
            <div class="acciones"><a class="btn btn-neutro" th:if="${@sesion.admin}" th:href="@{/espacios/update/{id}(id=${espacio.id})}"><th:block th:replace="~{fragmentos/iconos :: icono('editar')}"></th:block> Editar</a><a class="btn btn-primario" th:href="@{/reservas/add}"><th:block th:replace="~{fragmentos/iconos :: icono('calendario')}"></th:block> Reservar</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="grid-2">
            <div>
            <div class="cancha-grafica" style="margin-bottom:1.5rem">
                <svg th:replace="~{fragmentos/iconos :: cancha-grande}"></svg>
                <div class="tarjeta-flotante">
                    <strong th:text="${espacio.tipoDeporte}">futbol 5</strong>
                    <span th:text="'$' + ${#numbers.formatDecimal(espacio.precioHora, 1, 'POINT', 0, 'COMMA')} + ' por hora'">$80.000 por hora</span>
                </div>
            </div>
            <div class="tarjeta tarjeta-cuerpo">
                <h3 class="tarjeta-titulo">Información</h3>
                <dl class="datos">
                    <div class="fila"><dt>Tipo de cancha</dt><dd th:text="${espacio.tipoDeporte}">futbol 5</dd></div>
                    <div class="fila"><dt>Precio por hora</dt><dd class="verde" th:text="'$' + ${#numbers.formatDecimal(espacio.precioHora, 1, 'POINT', 0, 'COMMA')}">$80.000</dd></div>
                    <div class="fila"><dt>Capacidad</dt><dd th:text="${espacio.capacidad != null} ? ${espacio.capacidad} + ' jugadores' : '—'">10</dd></div>
                    <div class="fila"><dt>Negocio</dt><dd><a th:if="${espacio.negocio != null}" th:href="@{/negocios/{id}(id=${espacio.negocio.id})}" th:text="${espacio.negocio.nombre}">Negocio</a></dd></div>
                </dl>
                <p class="texto-largo" style="margin-top:1.2rem" th:if="${espacio.descripcion != null and !#strings.isEmpty(espacio.descripcion)}" th:text="${espacio.descripcion}">Descripción</p>
            </div>
            </div>
            <div class="tarjeta tarjeta-cuerpo">
                <h3 class="tarjeta-titulo">Calificaciones
                    <a class="enlace-flecha" style="font-size:.8rem" th:href="@{/calificaciones(espacioId=${espacio.id})}">Ver todas →</a></h3>
                <div class="promedio-grande" style="margin-bottom:.4rem">
                    <span class="valor" th:text="${#numbers.formatDecimal(promedio, 1, 1)}">4.5</span><span class="de">/ 5</span>
                </div>
                <span th:replace="~{fragmentos/iconos :: estrellas(${(promedio + 0.5).intValue()})}"></span>
                <p class="texto-largo" style="margin:.3rem 0 1.2rem" th:text="${#lists.size(calificaciones)} + ' opiniones'">2 opiniones</p>

                <p class="texto-largo" th:if="${#lists.isEmpty(calificaciones)}">Esta cancha aún no tiene calificaciones.</p>
                <div class="lista-resenas" th:unless="${#lists.isEmpty(calificaciones)}">
                    <div class="resena" th:each="c : ${calificaciones}">
                        <span class="avatar" th:text="${c.usuario != null} ? ${#strings.substring(c.usuario.nombre,0,1)} : '?'">L</span>
                        <div>
                            <div class="cabeza">
                                <strong th:text="${c.usuario != null} ? ${c.usuario.nombre} : 'Jugador'">Laura</strong>
                                <span th:replace="~{fragmentos/iconos :: estrellas(${c.puntuacion})}"></span>
                            </div>
                            <p th:text="${c.comentario != null and !#strings.isEmpty(c.comentario)} ? ${c.comentario} : 'Sin comentario'">Excelente</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
