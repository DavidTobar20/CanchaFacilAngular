<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${titulo})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('canchas')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
                <h1 th:text="${titulo}">Canchas</h1>
                <p>Encuentra la cancha ideal por tipo, precio y calificación.</p>
            </div>
            <div class="acciones"><a class="btn btn-primario" th:if="${@sesion.admin}" th:href="@{/espacios/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Nueva cancha</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="tarjeta" style="margin-bottom:1.5rem">
            <div class="herramientas" style="border-bottom:none">
                <div class="chips">
                    <a class="chip" th:classappend="${param.deporte == null} ? 'activo'" th:href="@{/espacios}">Todas</a>
                    <a class="chip" th:classappend="${param.deporte != null and #strings.equalsIgnoreCase(param.deporte[0],'futbol 5')} ? 'activo'" th:href="@{/espacios(deporte='futbol 5')}">Fútbol 5</a>
                    <a class="chip" th:classappend="${param.deporte != null and #strings.equalsIgnoreCase(param.deporte[0],'futbol 8')} ? 'activo'" th:href="@{/espacios(deporte='futbol 8')}">Fútbol 8</a>
                    <a class="chip" th:classappend="${param.deporte != null and #strings.equalsIgnoreCase(param.deporte[0],'futbol 11')} ? 'activo'" th:href="@{/espacios(deporte='futbol 11')}">Fútbol 11</a>
                </div>
                <form th:action="@{/espacios}" method="get">
                    <div class="busqueda">
                        <th:block th:replace="~{fragmentos/iconos :: icono('buscar')}"></th:block>
                        <input class="control" type="text" name="deporte" placeholder="Buscar por tipo de cancha" th:value="${param.deporte}">
                    </div>
                    <button class="btn btn-neutro btn-sm" type="submit">Buscar</button>
                </form>
            </div>
        </div>

        <div class="tarjeta" th:if="${#lists.isEmpty(espacios)}">
            <div class="vacio">
                <div class="icono-vacio"><th:block th:replace="~{fragmentos/iconos :: icono('cancha')}"></th:block></div>
                <strong>No encontramos canchas</strong>
                <p>Prueba con otro tipo de cancha o revisa más tarde.</p>
                <a class="btn btn-neutro" th:href="@{/espacios}">Ver todas</a>
            </div>
        </div>

        <div class="grid-canchas" th:unless="${#lists.isEmpty(espacios)}">
            <article class="tarjeta-cancha" th:each="e : ${espacios}">
                <div class="portada">
                    <svg th:replace="~{fragmentos/iconos :: cancha-svg}"></svg>
                    <span class="insignia izq" th:text="${e.capacidad != null} ? ${e.capacidad} + ' jugadores' : 'Disponible'">10 jugadores</span>
                    <span class="insignia insignia-naranja der" th:text="${e.tipoDeporte}">Fútbol 5</span>
                </div>
                <div class="cuerpo">
                    <div class="fila-titulo">
                        <h3><a th:href="@{/espacios/{id}(id=${e.id})}" th:text="${e.nombre}">Cancha</a></h3>
                        <span class="rating" th:with="p=${promedios.get(e.id)}">
                            <th:block th:replace="~{fragmentos/iconos :: icono('estrella-llena')}"></th:block>
                            <span th:text="${p != null and p > 0} ? ${#numbers.formatDecimal(p, 1, 1)} : 'Nuevo'">4.9</span>
                        </span>
                    </div>
                    <div class="ubicacion">
                        <th:block th:replace="~{fragmentos/iconos :: icono('ubicacion')}"></th:block>
                        <span th:text="${e.negocio != null} ? ${e.negocio.nombre} : '-'">Negocio</span>
                    </div>
                    <div class="pie">
                        <div>
                            <div class="precio-etiqueta">Precio</div>
                            <div class="precio" th:text="'$' + ${#numbers.formatDecimal(e.precioHora, 1, 'POINT', 0, 'COMMA')} + ' / hora'">$65.000 / hora</div>
                        </div>
                        <a class="btn btn-suave btn-sm" th:href="@{/espacios/{id}(id=${e.id})}">Ver detalle</a>
                    </div>
                    <div class="acciones-admin" th:if="${@sesion.admin}">
                        <a class="btn btn-neutro btn-sm" th:href="@{/espacios/update/{id}(id=${e.id})}"><th:block th:replace="~{fragmentos/iconos :: icono('editar')}"></th:block> Editar</a>
                        <a class="btn btn-peligro btn-sm" th:href="@{/espacios/delete/{id}(id=${e.id})}"
                           onclick="return confirm('¿Eliminar esta cancha y todas sus reservas?')"><th:block th:replace="~{fragmentos/iconos :: icono('basura')}"></th:block> Eliminar</a>
                    </div>
                </div>
            </article>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
