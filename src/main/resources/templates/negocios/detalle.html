<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${negocio.nombre})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('negocios')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/negocios}">Negocios</a><span>/</span><span th:text="${negocio.nombre}">Negocio</span></div>
                <h1 th:text="${negocio.nombre}">Negocio</h1>
                <p><span th:text="'NIT ' + ${negocio.nit}">NIT</span></p>
            </div>
            <div class="acciones"><a class="btn btn-neutro" th:href="@{/negocios/update/{id}(id=${negocio.id})}"><th:block th:replace="~{fragmentos/iconos :: icono('editar')}"></th:block> Editar</a><a class="btn btn-primario" th:if="${@sesion.admin}" th:href="@{/espacios/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Agregar cancha</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="grid-2">
            <div class="tarjeta tarjeta-cuerpo">
                <h3 class="tarjeta-titulo">Información</h3>
                <dl class="datos">
                    <div class="fila"><dt>NIT</dt><dd th:text="${negocio.nit}">900</dd></div>
                    <div class="fila"><dt>Dirección</dt><dd th:text="${negocio.direccion}">Calle</dd></div>
                    <div class="fila"><dt>Administrador</dt><dd th:text="${negocio.administrador != null} ? ${negocio.administrador.nombre} : 'Sin asignar'">Admin</dd></div>
                    <div class="fila"><dt>Canchas</dt><dd class="verde" th:text="${#lists.size(negocio.espacios)}">2</dd></div>
                </dl>
                <p class="texto-largo" style="margin-top:1.2rem" th:if="${negocio.descripcion != null and !#strings.isEmpty(negocio.descripcion)}" th:text="${negocio.descripcion}">Descripción</p>
            </div>
            <div class="tarjeta">
                <div class="tarjeta-cuerpo" style="padding-bottom:0"><h3 class="tarjeta-titulo">Canchas del negocio</h3></div>
                <p class="texto-largo tarjeta-cuerpo" th:if="${#lists.isEmpty(negocio.espacios)}">Este negocio aún no tiene canchas.</p>
                <table class="tabla" th:unless="${#lists.isEmpty(negocio.espacios)}">
                    <tbody>
                    <tr th:each="e : ${negocio.espacios}">
                        <td><a class="principal" th:href="@{/espacios/{id}(id=${e.id})}" th:text="${e.nombre}">Cancha</a>
                            <span class="secundario" th:text="${e.tipoDeporte}">futbol 5</span></td>
                        <td class="num" style="text-align:right" th:text="'$' + ${#numbers.formatDecimal(e.precioHora, 1, 'POINT', 0, 'COMMA')} + '/h'">$80.000/h</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
