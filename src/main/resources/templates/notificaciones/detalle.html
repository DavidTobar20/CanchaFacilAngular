<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${notificacion.tipo})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('notificaciones')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/notificaciones}">Notificaciones</a><span>/</span><span th:text="'#' + ${notificacion.id}">#1</span></div>
                <h1 th:text="${notificacion.tipo}">Notificación</h1>
                <p><span class="insignia" th:classappend="${notificacion.leido} ? 'insignia-gris' : 'insignia-ambar'" th:text="${notificacion.leido} ? 'Leída' : 'Sin leer'">Sin leer</span></p>
            </div>
            <div class="acciones"><a class="btn btn-primario" th:unless="${notificacion.leido}" th:href="@{/notificaciones/leer/{id}(id=${notificacion.id})}"><th:block th:replace="~{fragmentos/iconos :: icono('check')}"></th:block> Marcar como leída</a><a class="btn btn-neutro" th:href="@{/notificaciones/update/{id}(id=${notificacion.id})}"><th:block th:replace="~{fragmentos/iconos :: icono('editar')}"></th:block> Editar</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="tarjeta tarjeta-cuerpo">
            <div class="detalle-cabecera" style="margin-bottom:1.2rem">
                <div class="icono-grande"><th:block th:replace="~{fragmentos/iconos :: icono('campana')}"></th:block></div>
                <div>
                    <strong th:text="${notificacion.usuario != null} ? 'Para ' + ${notificacion.usuario.nombre} : ''">Para Laura</strong>
                    <div class="ayuda" style="margin:0" th:text="${notificacion.fecha != null} ? ${#temporals.format(notificacion.fecha, 'EEEE d MMMM yyyy, HH:mm')} : ''">fecha</div>
                </div>
            </div>
            <p class="texto-largo" style="font-size:1rem" th:text="${notificacion.mensaje}">Mensaje</p>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
