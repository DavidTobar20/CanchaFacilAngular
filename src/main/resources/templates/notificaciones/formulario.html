<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${accion})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('notificaciones')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/notificaciones}">Notificaciones</a><span>/</span><span th:text="${accion}">Nueva</span></div>
                <h1 th:text="${accion}">Crear notificación</h1>
                <p>La notificación se crea como no leída.</p>
            </div>
            <div class="acciones"></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>
        <div class="tarjeta">
            <form class="tarjeta-cuerpo" th:action="@{/notificaciones/add}" th:object="${notificacion}" method="post" novalidate>
                <div class="alerta alerta-error" th:if="${#fields.hasGlobalErrors()}">
                    <th:block th:replace="~{fragmentos/iconos :: icono('alerta')}"></th:block>
                    <div><div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div></div>
                </div>
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="campo-form">
                        <label for="usuarioId">Destinatario</label>
                        <select class="control" id="usuarioId" name="usuarioId">
                            <option value="">-- Seleccione --</option>
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre} + ' · ' + ${u.email}"
                                    th:selected="${notificacion.usuario != null and notificacion.usuario.id == u.id}">Opcion</option>
                        </select>
                    </div>
                    <div class="campo-form">
                        <label for="tipo">Tipo</label>
                        <input class="control" type="text" id="tipo" th:field="*{tipo}" th:errorclass="campo-invalido" placeholder="RESERVA, PAGO, RECORDATORIO" list="tipos-notif">
                        <span class="error-campo" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
                    </div>
                    <div class="campo-form completo">
                        <label for="mensaje">Mensaje</label>
                        <textarea class="control" id="mensaje" th:field="*{mensaje}" th:errorclass="campo-invalido" rows="3" placeholder="Tu reserva fue confirmada..."></textarea>
                        <span class="error-campo" th:if="${#fields.hasErrors('mensaje')}" th:errors="*{mensaje}"></span>
                    </div>
                    <datalist id="tipos-notif"><option value="RESERVA"><option value="PAGO"><option value="RECORDATORIO"><option value="SISTEMA"></datalist>
                </div>
                <div class="form-acciones">
                    <a class="btn btn-neutro" th:href="@{/notificaciones}">Cancelar</a>
                    <button class="btn btn-primario" type="submit"><th:block th:replace="~{fragmentos/iconos :: icono('check')}"></th:block> Guardar</button>
                </div>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
