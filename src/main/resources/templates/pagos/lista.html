<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${titulo})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('pagos')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
                <h1 th:text="${titulo}">Pagos</h1>
                <p>Aprueba, rechaza o reembolsa los pagos de las reservas.</p>
            </div>
            <div class="acciones"><a class="btn btn-primario" th:href="@{/pagos/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Registrar pago</a></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>

        <div class="tarjeta">
            <div class="herramientas">
                <div class="chips">
                    <a class="chip" th:classappend="${param.estado == null} ? 'activo'" th:href="@{/pagos}">Todos</a>
                    <a class="chip" th:each="e : ${ {'PENDIENTE','APROBADO','RECHAZADO','REEMBOLSADO'} }"
                       th:classappend="${param.estado != null and param.estado[0] == e} ? 'activo'"
                       th:href="@{/pagos(estado=${e})}" th:text="${#strings.capitalize(#strings.toLowerCase(e))}">Aprobado</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(pagos)}">
            <div class="vacio">
                <div class="icono-vacio"><th:block th:replace="~{fragmentos/iconos :: icono('tarjeta')}"></th:block></div>
                <strong>No hay pagos para mostrar</strong>
                <p>Registra el pago de una reserva para verlo aquí.</p>
                <a class="btn btn-primario" th:href="@{/pagos/add}"><th:block th:replace="~{fragmentos/iconos :: icono('mas')}"></th:block> Registrar pago</a>
            </div>
            </div>

            <div class="tabla-envoltura" th:unless="${#lists.isEmpty(pagos)}">
                <table class="tabla">
                    <thead><tr><th>#</th><th>Reserva</th><th>Monto</th><th>Método</th><th>Referencia</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${pagos}">
                        <td class="id" th:text="${p.id}">1</td>
                        <td th:if="${p.reserva != null}">
                            <a class="principal" th:href="@{/reservas/{id}(id=${p.reserva.id})}" th:text="'Reserva #' + ${p.reserva.id}">Reserva #1</a>
                            <span class="secundario" th:text="${p.reserva.espacio != null} ? ${p.reserva.espacio.nombre} : ''">Cancha</span>
                        </td>
                        <td th:unless="${p.reserva != null}">-</td>
                        <td class="num" th:text="'$' + ${#numbers.formatDecimal(p.monto, 1, 'POINT', 0, 'COMMA')}">$80.000</td>
                        <td th:text="${p.metodoPago}">Tarjeta</td>
                        <td class="id" th:text="${p.referencia}">TRX-1</td>
                        <td><span class="insignia insignia-punto" th:classappend="'estado-' + ${p.estado}" th:text="${p.estado}">PENDIENTE</span></td>
                        <td>
                            <div class="acciones-fila">
                                <a class="btn btn-suave btn-sm" th:if="${p.estado == 'PENDIENTE'}" th:href="@{/pagos/estado/{id}(id=${p.id}, valor='APROBADO')}" title="Aprobar"><th:block th:replace="~{fragmentos/iconos :: icono('check')}"></th:block></a>
                                <a class="btn btn-neutro btn-sm" th:if="${p.estado == 'PENDIENTE'}" th:href="@{/pagos/estado/{id}(id=${p.id}, valor='RECHAZADO')}" title="Rechazar"><th:block th:replace="~{fragmentos/iconos :: icono('x')}"></th:block></a>
                                <a class="btn btn-neutro btn-sm" th:href="@{/pagos/{id}(id=${p.id})}">Ver</a>
                                <a class="btn btn-peligro btn-sm" th:href="@{/pagos/delete/{id}(id=${p.id})}"
                                   onclick="return confirm('¿Eliminar este pago?')" title="Eliminar"><th:block th:replace="~{fragmentos/iconos :: icono('basura')}"></th:block></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
