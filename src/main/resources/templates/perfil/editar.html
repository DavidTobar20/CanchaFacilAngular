<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Editar perfil')}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('perfil')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/perfil}">Mi perfil</a><span>/</span><span>Editar</span></div>
                <h1 >Editar perfil</h1>
                <p>Actualiza tus datos de contacto o cambia tu contraseña.</p>
            </div>
            <div class="acciones"></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>
        <div class="tarjeta">
            <form class="tarjeta-cuerpo" th:action="@{/perfil/editar}" th:object="${usuario}" method="post" novalidate>
                <div class="alerta alerta-error" th:if="${#fields.hasGlobalErrors()}">
                    <th:block th:replace="~{fragmentos/iconos :: icono('alerta')}"></th:block>
                    <div><div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div></div>
                </div>
                <div class="campo-form">
                    <span class="etiqueta-campo">Correo electrónico</span>
                    <input class="control" type="email" th:value="${@sesion.email}" disabled>
                    <span class="ayuda">El correo es tu usuario de acceso y no se puede cambiar.</span>
                </div>
                <div class="form-grid">
                    <div class="campo-form completo">
                        <label for="nombre">Nombre completo</label>
                        <input class="control" type="text" id="nombre" th:field="*{nombre}" th:errorclass="campo-invalido">
                        <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="telefono">Teléfono</label>
                        <input class="control" type="text" id="telefono" th:field="*{telefono}" th:errorclass="campo-invalido" placeholder="3001234567">
                        <span class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="direccion">Dirección</label>
                        <input class="control" type="text" id="direccion" th:field="*{direccion}" th:errorclass="campo-invalido" placeholder="Calle 10 # 20-30">
                        <span class="error-campo" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></span>
                    </div>
                    <div class="campo-form completo">
                        <label for="password">Nueva contraseña</label>
                        <input class="control" type="password" id="password" name="password" value="" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'campo-invalido' : ''">
                        <span class="ayuda">Déjala vacía para conservar tu contraseña actual.</span>
                        <span class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                </div>
                <div class="form-acciones">
                    <a class="btn btn-neutro" th:href="@{/perfil}">Cancelar</a>
                    <button class="btn btn-primario" type="submit"><th:block th:replace="~{fragmentos/iconos :: icono('check')}"></th:block> Guardar cambios</button>
                </div>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
