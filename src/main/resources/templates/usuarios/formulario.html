<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${accion})}"></head>
<body class="app">

<header th:replace="~{fragmentos/layout :: topbar}"></header>

<div class="app-cuerpo">
    <aside th:replace="~{fragmentos/layout :: sidebar('usuarios')}"></aside>

    <main class="app-main">
        <div class="pagina-cabecera">
            <div>
            <div class="migas"><a th:href="@{/usuarios}">Usuarios</a><span>/</span><span th:text="${accion}">Nuevo</span></div>
                <h1 th:text="${accion}">Crear usuario</h1>
                <p>Los administradores pueden crear cuentas con cualquier rol.</p>
            </div>
            <div class="acciones"></div>
        </div>

        <th:block th:replace="~{fragmentos/layout :: alertas}"></th:block>
        <div class="tarjeta">
            <form class="tarjeta-cuerpo" th:action="@{/usuarios/add}" th:object="${usuario}" method="post" novalidate>
                <div class="alerta alerta-error" th:if="${#fields.hasGlobalErrors()}">
                    <th:block th:replace="~{fragmentos/iconos :: icono('alerta')}"></th:block>
                    <div><div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div></div>
                </div>
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="campo-form">
                        <label for="nombre">Nombre completo</label>
                        <input class="control" type="text" id="nombre" th:field="*{nombre}" th:errorclass="campo-invalido" placeholder="David Morales">
                        <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="email">Correo electrónico</label>
                        <input class="control" type="email" id="email" th:field="*{email}" th:errorclass="campo-invalido" placeholder="correo@ejemplo.com">
                        <span class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="password">Contraseña</label>
                        <input class="control" type="password" id="password" name="password" value="" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'campo-invalido' : ''">
                        <span class="ayuda" th:if="${usuario.id != null}">Déjala vacía para conservar la actual.</span>
                        <span class="ayuda" th:if="${usuario.id == null}">Mínimo 6 caracteres.</span>
                        <span class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="rol">Rol</label>
                        <select class="control" id="rol" th:field="*{rol}" th:errorclass="campo-invalido">
                            <option value="">-- Seleccione --</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">CLIENTE</option>
                        </select>
                        <span class="error-campo" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="telefono">Teléfono</label>
                        <input class="control" type="text" id="telefono" th:field="*{telefono}" th:errorclass="campo-invalido" placeholder="3001234567">
                        <span class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></span>
                    </div>
                    <div class="campo-form">
                        <label for="direccion">Dirección</label>
                        <input class="control" type="text" id="direccion" th:field="*{direccion}" th:errorclass="campo-invalido" placeholder="Calle 10 # 20-30">
                        <span class="error-campo" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></span>
                    </div>
                </div>
                <div class="form-acciones">
                    <a class="btn btn-neutro" th:href="@{/usuarios}">Cancelar</a>
                    <button class="btn btn-primario" type="submit"><th:block th:replace="~{fragmentos/iconos :: icono('check')}"></th:block> Guardar</button>
                </div>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragmentos/layout :: footer-app}"></footer>

</body>
</html>
